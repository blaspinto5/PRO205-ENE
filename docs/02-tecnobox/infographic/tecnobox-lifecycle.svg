<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930"><text font-family="Arial, sans-serif" font-size="29" font-weight="bold" x="40" y="47" fill="#173349">TECNOBOX | POO y ciclo de vida</text><text font-family="Arial, sans-serif" font-size="17" font-weight="normal" x="40" y="77" fill="#173349">Control de entradas, salidas y stock - modelo incremental propuesto</text><text font-family="Arial, sans-serif" font-size="15" font-weight="normal" x="40" y="110" fill="#173349">Cada incremento recorre y revisa estas actividades; las pruebas acompañan el desarrollo.</text><rect x="40" y="170" width="360" height="268" fill="#eef6f7" stroke="#c4d8df" rx="8" /><text font-family="Arial, sans-serif" font-size="18" font-weight="bold" x="55" y="199" fill="#173349">1. REQUISITOS Y ANÁLISIS</text><text font-family="Arial, sans-serif" font-size="13" font-weight="bold" x="55" y="224" fill="#007c83">ABSTRACCIÓN</text><text font-family="Arial, sans-serif" font-size="11" font-weight="bold" x="55" y="252" fill="#173349">PRÁCTICA</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="55" y="271" fill="#173349">Separar necesidades del inventario de</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="55" y="289" fill="#173349">detalles de pantalla.</text><text font-family="Arial, sans-serif" font-size="11" font-weight="bold" x="55" y="315" fill="#173349">EJEMPLO</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="55" y="334" fill="#173349">Identificar productos, movimientos y consulta</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="55" y="352" fill="#173349">de existencias.</text><text font-family="Arial, sans-serif" font-size="11" font-weight="bold" x="55" y="378" fill="#173349">APORTE</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="55" y="397" fill="#173349">Enfocar el modelo; aclarar unidades y reglas</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="55" y="415" fill="#173349">pendientes.</text><rect x="420" y="170" width="360" height="268" fill="#eef6f7" stroke="#c4d8df" rx="8" /><text font-family="Arial, sans-serif" font-size="18" font-weight="bold" x="435" y="199" fill="#173349">2. DISEÑO</text><text font-family="Arial, sans-serif" font-size="13" font-weight="bold" x="435" y="224" fill="#007c83">ENCAPSULAMIENTO + MODULARIDAD</text><text font-family="Arial, sans-serif" font-size="11" font-weight="bold" x="435" y="252" fill="#173349">PRÁCTICA</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="435" y="271" fill="#173349">Ubicar reglas en objetos y separar</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="435" y="289" fill="#173349">responsabilidades.</text><text font-family="Arial, sans-serif" font-size="11" font-weight="bold" x="435" y="315" fill="#173349">EJEMPLO</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="435" y="334" fill="#173349">Diseñar operaciones de Inventory y contrato</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="435" y="352" fill="#173349">de almacenamiento.</text><text font-family="Arial, sans-serif" font-size="11" font-weight="bold" x="435" y="378" fill="#173349">APORTE</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="435" y="397" fill="#173349">Proteger invariantes y reducir acoplamiento</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="435" y="415" fill="#173349">entre módulos.</text><rect x="800" y="170" width="360" height="268" fill="#eef6f7" stroke="#c4d8df" rx="8" /><text font-family="Arial, sans-serif" font-size="18" font-weight="bold" x="815" y="199" fill="#173349">3. IMPLEMENTACIÓN</text><text font-family="Arial, sans-serif" font-size="13" font-weight="bold" x="815" y="224" fill="#007c83">REUTILIZACIÓN + CONTRATOS</text><text font-family="Arial, sans-serif" font-size="11" font-weight="bold" x="815" y="252" fill="#173349">PRÁCTICA</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="815" y="271" fill="#173349">Implementar casos de uso comunes y contratos</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="815" y="289" fill="#173349">coherentes.</text><text font-family="Arial, sans-serif" font-size="11" font-weight="bold" x="815" y="315" fill="#173349">EJEMPLO</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="815" y="334" fill="#173349">Reutilizar una operación de movimiento en</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="815" y="352" fill="#173349">distintas pantallas.</text><text font-family="Arial, sans-serif" font-size="11" font-weight="bold" x="815" y="378" fill="#173349">APORTE</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="815" y="397" fill="#173349">Evitar lógica duplicada; polimorfismo si el</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="815" y="415" fill="#173349">contrato lo requiere.</text><rect x="800" y="505" width="360" height="268" fill="#eef6f7" stroke="#c4d8df" rx="8" /><text font-family="Arial, sans-serif" font-size="18" font-weight="bold" x="815" y="534" fill="#173349">4. PRUEBAS</text><text font-family="Arial, sans-serif" font-size="13" font-weight="bold" x="815" y="559" fill="#007c83">AISLAMIENTO + ENCAPSULAMIENTO</text><text font-family="Arial, sans-serif" font-size="11" font-weight="bold" x="815" y="587" fill="#173349">PRÁCTICA</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="815" y="606" fill="#173349">Probar objetos y casos de uso con datos</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="815" y="624" fill="#173349">controlados.</text><text font-family="Arial, sans-serif" font-size="11" font-weight="bold" x="815" y="650" fill="#173349">EJEMPLO</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="815" y="669" fill="#173349">Validar entrada/salida según reglas</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="815" y="687" fill="#173349">acordadas; sustituir persistencia.</text><text font-family="Arial, sans-serif" font-size="11" font-weight="bold" x="815" y="713" fill="#173349">APORTE</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="815" y="732" fill="#173349">Detectar inconsistencias y ejecutar regresión</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="815" y="750" fill="#173349">por incremento.</text><rect x="420" y="505" width="360" height="268" fill="#eef6f7" stroke="#c4d8df" rx="8" /><text font-family="Arial, sans-serif" font-size="18" font-weight="bold" x="435" y="534" fill="#173349">5. DESPLIEGUE</text><text font-family="Arial, sans-serif" font-size="13" font-weight="bold" x="435" y="559" fill="#007c83">MODULARIDAD + CONFIGURACIÓN</text><text font-family="Arial, sans-serif" font-size="11" font-weight="bold" x="435" y="587" fill="#173349">PRÁCTICA</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="435" y="606" fill="#173349">Integrar módulos manteniendo sus</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="435" y="624" fill="#173349">responsabilidades.</text><text font-family="Arial, sans-serif" font-size="11" font-weight="bold" x="435" y="650" fill="#173349">EJEMPLO</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="435" y="669" fill="#173349">Configurar almacenamiento sin mover reglas a</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="435" y="687" fill="#173349">la interfaz.</text><text font-family="Arial, sans-serif" font-size="11" font-weight="bold" x="435" y="713" fill="#173349">APORTE</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="435" y="732" fill="#173349">Facilitar integración; POO no sustituye</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="435" y="750" fill="#173349">empaquetado ni configuración.</text><rect x="40" y="505" width="360" height="268" fill="#eef6f7" stroke="#c4d8df" rx="8" /><text font-family="Arial, sans-serif" font-size="18" font-weight="bold" x="55" y="534" fill="#173349">6. MANTENIMIENTO</text><text font-family="Arial, sans-serif" font-size="13" font-weight="bold" x="55" y="559" fill="#007c83">EXTENSIÓN + REUTILIZACIÓN</text><text font-family="Arial, sans-serif" font-size="11" font-weight="bold" x="55" y="587" fill="#173349">PRÁCTICA</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="55" y="606" fill="#173349">Revisar impacto y conservar contratos cuando</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="55" y="624" fill="#173349">sea posible.</text><text font-family="Arial, sans-serif" font-size="11" font-weight="bold" x="55" y="650" fill="#173349">EJEMPLO</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="55" y="669" fill="#173349">Analizar devoluciones si se solicitan y</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="55" y="687" fill="#173349">ajustar operaciones afectadas.</text><text font-family="Arial, sans-serif" font-size="11" font-weight="bold" x="55" y="713" fill="#173349">APORTE</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="55" y="732" fill="#173349">Limitar propagación de cambios; reutilizar</text><text font-family="Arial, sans-serif" font-size="14" font-weight="normal" x="55" y="750" fill="#173349">pruebas y operaciones.</text><polyline stroke-width="2" points="400,300 420,300" fill="none" stroke="#007c83" /><polygon points="420,300 408.0,294.0 408.0,306.0" fill="#007c83" /><polyline stroke-width="2" points="780,300 800,300" fill="none" stroke="#007c83" /><polygon points="800,300 788.0,294.0 788.0,306.0" fill="#007c83" /><polyline stroke-width="2" points="980,438 980,505" fill="none" stroke="#007c83" /><polygon points="980,505 986.0,493.0 974.0,493.0" fill="#007c83" /><text font-family="Arial, sans-serif" font-size="12" font-weight="normal" x="990" y="478" fill="#173349">validar</text><polyline stroke-width="2" points="800,638 780,638" fill="none" stroke="#007c83" /><polygon points="780,638 792.0,644.0 792.0,632.0" fill="#007c83" /><polyline stroke-width="2" points="420,638 400,638" fill="none" stroke="#007c83" /><polygon points="400,638 412.0,644.0 412.0,632.0" fill="#007c83" /><polyline stroke-width="2" points="40,638 17,638 17,145 220,145 220,170" fill="none" stroke="#007c83" /><polygon points="220,170 226.0,158.0 214.0,158.0" fill="#007c83" /><text font-family="Arial, sans-serif" font-size="12" font-weight="normal" x="43" y="153" fill="#007c83">retroalimentación: nuevos requisitos y revisión</text><rect x="40" y="807" width="1120" height="87" fill="#173349" stroke="#c4d8df" rx="8" /><text font-family="Arial, sans-serif" font-size="14" font-weight="bold" x="57" y="835" fill="#ffffff">RELACIONES CLAVE</text><text font-family="Arial, sans-serif" font-size="16" font-weight="normal" x="57" y="860" fill="#ffffff">Encapsular protege reglas; modularizar limita impactos; reutilizar evita duplicación.</text><text font-family="Arial, sans-serif" font-size="13" font-weight="normal" x="40" y="917" fill="#173349">Subtarea 2B - C.E. 2.4 | Ejemplos propuestos; no se afirma implementación ni beneficios medidos.</text></svg>